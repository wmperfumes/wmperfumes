<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WM Perfumes</title>

    <link rel="stylesheet" href="style.css">

    <link rel="icon" href="logo.png" type="image/png">

</head>

<body>

    <!-- Banner principal -->

    <section id="inicio" class="hero">

        <img src="logo.png" class="hero-logo" alt="WM Perfumes">

        <h1>WM Perfumes</h1>

        <p>Tu esencia, tu firma </p>

        <input
            type="text"
            id="buscador"
            placeholder="Buscar perfume..."
        >

    </section>

    <!-- Menú -->

<nav>

    <ul>
        <li><a href="#inicio">Inicio</a></li>
        <li><a href="#catalogo">Catálogo</a></li>
        <li><a href="#contacto">Contacto</a></li>
    </ul>

</nav>

    <!-- Catálogo -->

    <section id="catalogo" class="catalogo">

        <!-- Los productos se agregan automáticamente desde productos.js -->

    </section>

    <!-- Contacto -->

    <footer id="contacto">

        <h2>WM Perfumes</h2>

        <p>WhatsApp: +56 9 9929 3833</p>

        <p> Tu esencia, tu firma</p>

        <p>© 2026 WM Perfumes</p>

    </footer>

    <script src="productos.js"></script>

    <script src="script.js"></script>

</body>

</html>
